<style>
:root{
  --ink:#2a2724; --ink-soft:#5b544c; --paper:#f7f4ec;
  --line:rgba(42,39,36,.14);
  --bronze:#a9743f; --silver:#8b949e; --gold:#c39b2a; --jade:#3f9e8a;
  --seal:#a8322d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  color:var(--ink); min-height:100vh; padding-bottom:90px;
  background-color:#f4f1e8;
  background-image:
    radial-gradient(ellipse at 12% 8%, rgba(88,104,116,.14), transparent 45%),
    radial-gradient(ellipse at 88% 16%, rgba(108,118,108,.12), transparent 42%),
    radial-gradient(ellipse at 45% 96%, rgba(132,120,98,.14), transparent 52%),
    linear-gradient(170deg,#f9f6ef 0%,#efe9dd 55%,#e7e0d1 100%);
  background-attachment:fixed;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.014) 0 1px, transparent 1px 3px);
}
/* ===== 头部 ===== */
header{
  position:sticky;top:0;z-index:60;
  background:rgba(246,243,235,.9);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(42,39,36,.15);
  box-shadow:0 4px 22px rgba(60,55,45,.07);
}
.hwrap{
  max-width:900px;margin:0 auto;padding:14px 18px 10px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{
  width:46px;height:46px;flex:0 0 auto;border-radius:9px;
  background:linear-gradient(150deg,#b93a34,#8f2723);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:25px;font-family:"KaiTi","STKaiti",serif;
  box-shadow:0 3px 12px rgba(168,50,45,.38);
}
h1{font-size:19px;letter-spacing:4px;font-weight:700;font-family:"KaiTi","STKaiti",serif}
.sub{font-size:11px;color:var(--ink-soft);letter-spacing:1px;margin-top:3px}
.total{text-align:right;flex:0 0 auto}
.tlabel{font-size:11px;letter-spacing:3px;color:var(--ink-soft)}
.tval{font-size:27px;font-weight:700;line-height:1.15;font-family:Georgia,"Times New Roman",serif;color:#1c1916;letter-spacing:.5px}
.tmoney{font-size:11px;color:var(--ink-soft);letter-spacing:.5px}
/* ===== 搜索 ===== */
.searchbar{position:relative;max-width:900px;margin:0 auto;padding:0 18px 12px;display:flex;align-items:center}
.sicon{position:absolute;left:33px;font-size:14px;opacity:.4;pointer-events:none}
#search{
  width:100%;padding:11px 42px 11px 42px;font-size:15px;font-family:inherit;
  border:1px solid rgba(42,39,36,.2);border-radius:24px;
  background:rgba(255,255,255,.62);color:var(--ink);outline:none;transition:.22s;
}
#search::placeholder{color:#9a938a;font-size:13.5px}
#search:focus{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(42,39,36,.07)}
#clearBtn{
  position:absolute;right:30px;width:24px;height:24px;border-radius:50%;border:none;
  background:rgba(42,39,36,.08);color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;
}
#clearBtn:hover{background:rgba(42,39,36,.18)}
.results{
  position:absolute;left:18px;right:18px;top:calc(100% - 8px);
  background:#fdfbf6;border:1px solid rgba(42,39,36,.16);border-radius:10px;
  box-shadow:0 14px 34px rgba(50,45,35,.18);z-index:80;overflow:hidden;display:none;
}
.results.show{display:block}
.ritem{
  padding:11px 15px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;
  border-bottom:1px solid rgba(42,39,36,.07);font-size:14px;transition:.15s;
}
.ritem:last-child{border-bottom:none}
.ritem:hover{background:rgba(42,39,36,.055)}
.ritem .rp{color:var(--seal);font-weight:700;flex:0 0 auto;font-size:13px}
/* ===== 导航 ===== */
nav{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:0 14px;overflow-x:auto}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:1;min-width:76px;padding:9px 4px;border:none;background:transparent;
  font-family:inherit;font-size:14px;color:var(--ink-soft);cursor:pointer;
  border-bottom:2px solid transparent;transition:.2s;white-space:nowrap;letter-spacing:1.5px;
}
nav button.active{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
/* ===== 主体 ===== */
main{max-width:900px;margin:0 auto;padding:18px;position:relative;z-index:1}
.quote{
  position:relative;padding:16px 20px 14px 24px;margin-bottom:22px;
  font-family:"KaiTi","STKaiti",serif;font-size:16.5px;line-height:1.85;color:#3f3b35;
  background:linear-gradient(90deg, rgba(255,255,255,.6), rgba(255,255,255,.12));
  border-left:3px solid rgba(42,39,36,.34);border-radius:0 9px 9px 0;
}
.quote .qmark{position:absolute;left:8px;top:4px;font-size:30px;color:rgba(42,39,36,.16);font-family:Georgia,serif}
.quote .qdate{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:8px;letter-spacing:2px;font-family:inherit}
.cat{
  margin:26px 0 12px;font-size:16.5px;letter-spacing:2px;position:relative;
  padding-left:14px;display:flex;justify-content:space-between;align-items:baseline;
}
.cat::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:15px;background:var(--ink);border-radius:2px}
.cat:first-child{margin-top:0}
.cprog{font-size:12px;color:var(--ink-soft);letter-spacing:1px;font-weight:400}
/* ===== 任务卡片 ===== */
.task{
  display:flex;align-items:center;gap:12px;padding:12px 15px;margin-bottom:9px;
  background:rgba(255,255,255,.5);border:1px solid var(--line);
  border-left:3px solid var(--ink-soft);border-radius:7px;cursor:pointer;
  transition:.2s;position:relative;user-select:none;
}
.task:hover{background:rgba(255,255,255,.85);transform:translateX(3px);box-shadow:0 4px 14px rgba(60,55,45,.08)}
.task.done{opacity:.6}
.task.done .name{text-decoration:line-through;text-decoration-color:rgba(42,39,36,.4)}
.mark{
  width:20px;height:20px;flex:0 0 auto;border:1.5px solid rgba(42,39,36,.45);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.2s;
}
.task.done .mark{background:var(--ink);border-color:var(--ink);color:#f7f4ec}
.body{flex:1;min-width:0}
.name{font-size:15px;letter-spacing:.5px}
.desc{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.55}
.pts{font-weight:700;font-size:14px;color:var(--seal);white-space:nowrap;flex:0 0 auto;font-family:Georgia,serif}
.tag{
  font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid currentColor;
  margin-left:7px;opacity:.85;letter-spacing:1px;vertical-align:middle;font-weight:400;
}
.task.r-bronze{border-left-color:var(--bronze)}
.task.r-silver{border-left-color:var(--silver)}
.task.r-gold{border-left-color:var(--gold)}
.task.r-jade{border-left-color:var(--jade)}
.task.r-bronze .tag{color:var(--bronze)}
.task.r-silver .tag{color:var(--silver)}
.task.r-gold .tag{color:var(--gold)}
.task.r-jade .tag{color:var(--jade)}
/* ===== 删除按钮 ===== */
.del{
  width:22px;height:22px;flex:0 0 auto;border:none;background:transparent;
  color:rgba(42,39,36,.3);font-size:17px;line-height:1;cursor:pointer;
  border-radius:50%;transition:.15s;font-family:inherit;
}
.del:hover{background:rgba(168,50,45,.12);color:var(--seal)}
/* ===== 添加区 ===== */
.add-box{margin-bottom:16px}
.add-btn{
  width:100%;padding:10px;border:1px dashed rgba(42,39,36,.3);border-radius:7px;
  background:rgba(255,255,255,.35);color:var(--ink-soft);font-family:inherit;
  font-size:13.5px;letter-spacing:2px;cursor:pointer;transition:.2s;
}
.add-btn:hover{background:rgba(255,255,255,.75);border-color:var(--ink);color:var(--ink)}
.form-wrap{
  padding:14px;border:1px solid rgba(42,39,36,.16);border-radius:8px;
  background:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:9px;
}
.form-wrap input{
  padding:9px 12px;border:1px solid rgba(42,39,36,.2);border-radius:6px;
  font-family:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none;
  transition:.18s;
}
.form-wrap input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(42,39,36,.06)}
.f-actions{display:flex;gap:9px;justify-content:flex-end}
.f-actions button{
  padding:8px 18px;border-radius:6px;font-family:inherit;font-size:13.5px;
  cursor:pointer;letter-spacing:1px;border:1px solid rgba(42,39,36,.25);
  background:rgba(255,255,255,.85);color:var(--ink-soft);transition:.18s;
}
.f-actions button[data-submit]{background:var(--ink);color:#f7f4ec;border-color:var(--ink)}
.f-actions button:hover{transform:translateY(-1px)}
.add-locked{
  padding:11px;border:1px dashed rgba(42,39,36,.22);border-radius:7px;
  text-align:center;font-size:13px;color:var(--ink-soft);letter-spacing:1px;
  background:rgba(255,255,255,.25);line-height:1.6;
}
.add-locked .lk{font-size:14px;margin-right:5px}
/* ===== 提示 ===== */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(24px);
  background:rgba(42,39,36,.93);color:#f6f3ea;padding:11px 22px;border-radius:24px;
  font-size:14px;opacity:0;pointer-events:none;transition:.28s;z-index:300;
  max-width:86vw;text-align:center;letter-spacing:.5px;
  box-shadow:0 8px 26px rgba(30,26,22,.35);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:12px;color:var(--ink-soft);text-align:center;padding:6px 0 14px;letter-spacing:1px}
@media (max-width:520px){
  h1{font-size:16px;letter-spacing:2px}
  .tval{font-size:22px}
  .seal{width:40px;height:40px;font-size:21px}
  .name{font-size:14px}
  .desc{font-size:11.5px}
  .pts{font-size:13px}
}
</style>
</head>

/* ==================== 索引构建 ==================== */
const ALL = [];
const MAP = {};
let _h = 0, _s = 0;

function push(o){ ALL.push(o); MAP[o.id] = o; }

function rebuildIndex(){
  ALL.length = 0;
  for(const k in MAP) delete MAP[k];
  _h = 0; _s = 0;

  MAIN.forEach((t,i)=>push({n:t[0],d:t[1],p:t[2],id:'m'+i,type:'main'}));
  DAILY.forEach((t,i)=>push({n:t[0],d:t[1],p:t[2],id:'d'+i,type:'daily'}));
  HIDDEN.forEach(([cat,items])=>items.forEach(t=>push({n:t[0],d:t[1],p:t[2],id:'h'+(_h++),type:'hidden',cat})));
  SIDE.forEach(([cat,items])=>items.forEach(t=>push({n:t[0],d:t[1],p:t[2],id:'s'+(_s++),type:'side',cat})));

  (S.custom.side||[]).forEach(c=>push({n:c.n,d:c.d,p:c.p,id:c.id,type:'side',cat:'自定义支线',custom:true}));
  (S.custom.hidden||[]).forEach(c=>push({n:c.n,d:c.d,p:c.p,id:c.id,type:'hidden',cat:'自定义 · 编辑部',custom:true}));
}

/* ==================== 状态 ==================== */
const KEY = 'ink-achievement-v3';
let S = loadState();

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function loadState(){
  let s = {once:{}, daily:{}, dailyDate: todayStr(), custom:{side:[], hidden:[]}};
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      s.once = o.once || {};
      s.daily = o.daily || {};
      s.dailyDate = o.dailyDate || todayStr();
      s.custom = o.custom || {side:[], hidden:[]};
      if(!Array.isArray(s.custom.side)) s.custom.side = [];
      if(!Array.isArray(s.custom.hidden)) s.custom.hidden = [];
    }
  }catch(e){}
  if(s.dailyDate !== todayStr()){ s.dailyDate = todayStr(); s.daily = {}; }
  return s;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
rebuildIndex();

/* ==================== 工具 ==================== */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmt(p){
  if(p >= 10000){
    const w = p/10000;
    return (Number.isInteger(w) ? w : w.toFixed(1)) + 'W';
  }
  return String(p);
}
function fmtNum(n){ return n.toLocaleString('zh-CN'); }

/* 稀有度：铜 → 银 → 金 → 玉 */
function rarity(p){
  if(p <= 5000)  return ['r-bronze','铜'];
  if(p <= 15000) return ['r-silver','银'];
  if(p <= 30000) return ['r-gold','金'];
  return ['r-jade','玉'];
}

function isDone(t){ return t.type==='daily' ? !!S.daily[t.id] : !!S.once[t.id]; }
function storeOf(t){ return t.type==='daily' ? S.daily : S.once; }

/* ==================== 编辑部窗口 ==================== */
function isEditorOpen(){
  const now = new Date();
  const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  return now.getDate() === lastDay;
}
function nextEditorOpen(){
  const now = new Date();
  if(isEditorOpen()) return null;
  const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  return new Date(now.getFullYear(), now.getMonth(), lastDay, 0, 0, 0);
}

/* ==================== 积分 ==================== */
function totalPoints(){
  let sum = 0;
  for(const t of ALL){ if(isDone(t)) sum += t.p; }
  return sum;
}

/* ==================== 声音 ==================== */
let AC = null;
function beep(ok){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const now = AC.currentTime;
    const notes = ok ? [880, 1318.5] : [392, 294];
    notes.forEach((f,i)=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, now + i*0.085);
      g.gain.setValueAtTime(0.0001, now + i*0.085);
      g.gain.exponentialRampToValueAtTime(0.16, now + i*0.085 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.085 + 0.30);
      o.connect(g); g.connect(AC.destination);
      o.start(now + i*0.085); o.stop(now + i*0.085 + 0.34);
    });
  }catch(e){}
}

  toastTimer = setTimeout(()=>el.classList.remove('show'), 1900);
}

/* ==================== 渲染 ==================== */
let tab = 'daily';

function cardHTML(t){
  const done = isDone(t);
  const [cls,label] = rarity(t.p);
  const del = t.custom ? `<button class="del" data-del="${t.id}" title="删除">×</button>` : '';
  return `<div class="task ${cls}${done?' done':''}" data-id="${t.id}">
    <div class="mark">✓</div>
    <div class="body">
      <div class="name">${esc(t.n)}<span class="tag">${label}</span></div>
      ${t.d ? `<div class="desc">${esc(t.d)}</div>` : ''}
    </div>
    <div class="pts">+${fmt(t.p)}</div>
    ${del}
  </div>`;
}

function sectionHead(title, done, total){
  return `<div class="cat">${esc(title)}<span class="cprog">${done} / ${total}</span></div>`;
}

    : '';

    <div class="add-locked"><span class="lk">🔒</span>编辑部尚未开启 · ${when}<br>（每月末开启 24 小时，可添加自定义隐藏成就）</div>

function render(){
  const tp = totalPoints();
  document.getElementById('total').textContent = fmtNum(tp);
  document.getElementById('money').textContent = '≈ ¥' + (tp/100).toFixed(2);

  const c = document.getElementById('content');
  const list = ALL.filter(t=>t.type===tab);

  if(tab === 'hidden' || tab === 'side'){
    // 按分类动态分组（保持出现顺序）
    const cats = [];
    const groups = {};
    list.forEach(t=>{
      const cat = t.cat || '其他';
      if(!groups[cat]){ groups[cat] = []; cats.push(cat); }
      groups[cat].push(t);
    });
    let html = addAreaHTML(tab);
    cats.forEach(cat=>{
      const items = groups[cat];
      const doneN = items.filter(isDone).length;
      html += sectionHead(cat, doneN, items.length);
      html += items.map(cardHTML).join('');
    });
    c.innerHTML = html;
  }else if(tab === 'main'){
    const doneN = list.filter(isDone).length;
    c.innerHTML = sectionHead('主线任务', doneN, list.length) + list.map(cardHTML).join('');
  }else{
    const doneN = list.filter(isDone).length;
    const pts = list.filter(isDone).reduce((a,b)=>a+b.p,0);
    c.innerHTML = sectionHead('日常任务 · 每日刷新（基础合计 450 封顶）', doneN, list.length)
      + `<div class="hint">今日已获得 ${pts} / 450 积分 · 每日 0 点自动重置</div>`
      + list.map(cardHTML).join('');
  }
}

/* ==================== 增删逻辑 ==================== */
function addCustomTask(type, name, desc, pts){
  const id = (type === 'side' ? 'cs' : 'ch') + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  S.custom[type].push({id, n:name, d:desc, p:pts});
  save();
  rebuildIndex();
  render();
  beep(true);
  toast('✓ 已添加：' + name + '　+' + fmt(pts) + ' 积分');
}

function deleteCustom(id){
  const t = MAP[id];
  if(!t || !t.custom) return;
  const arr = S.custom[t.type];
  const idx = arr.findIndex(x=>x.id === id);
  if(idx < 0) return;
  const removed = arr.splice(idx, 1)[0];
  delete S.once[id];
  delete S.daily[id];
  save();
  rebuildIndex();
  render();
  beep(false);
  toast('已删除：' + removed.n);
}

/* ==================== 勾选逻辑 ==================== */
function completeTask(t){
  const store = storeOf(t);
  if(store[t.id]){
    toast('「' + t.n + '」已经完成啦');
    beep(true);
    return;
  }
  store[t.id] = 1;
  beep(true);
  toast('✓ ' + t.n + '　+' + fmt(t.p) + ' 积分');
  save();
  render();
}

function toggleTask(t){
  const store = storeOf(t);
  if(store[t.id]){
    delete store[t.id];
    beep(false);
    toast('已取消：' + t.n);
  }else{
    store[t.id] = 1;
    beep(true);
    toast('✓ ' + t.n + '　+' + fmt(t.p) + ' 积分');
  }
  save();
  render();
}

/* ==================== 内容区事件委托 ==================== */
document.getElementById('content').addEventListener('click', e=>{
  // 删除自定义任务
  const delBtn = e.target.closest('[data-del]');
  if(delBtn){
    e.stopPropagation();
    deleteCustom(delBtn.dataset.del);
    return;
  }

  // 打开添加表单
  const openBtn = e.target.closest('[data-open]');
  if(openBtn){
    const type = openBtn.dataset.open;
    const wrap = document.querySelector('[data-wrap="' + type + '"]');
    if(wrap){
      const showing = wrap.style.display !== 'none';
      wrap.style.display = showing ? 'none' : 'flex';
      if(!showing){
        const inp = wrap.querySelector('.f-name');
        if(inp) setTimeout(()=>inp.focus(), 40);
      }
    }
    return;
  }

  // 取消
  const cancelBtn = e.target.closest('[data-cancel]');
  if(cancelBtn){
    const type = cancelBtn.dataset.cancel;
    const wrap = document.querySelector('[data-wrap="' + type + '"]');
    if(wrap){
      wrap.style.display = 'none';
      wrap.querySelectorAll('input').forEach(i=>i.value='');
    }
    return;
  }

  // 提交
  const submitBtn = e.target.closest('[data-submit]');
  if(submitBtn){
    const type = submitBtn.dataset.submit;
    const wrap = document.querySelector('[data-wrap="' + type + '"]');
    if(!wrap) return;
    const name = wrap.querySelector('.f-name').value.trim();
    const desc = wrap.querySelector('.f-desc').value.trim();
    const ptsRaw = wrap.querySelector('.f-pts').value.trim();
    const pts = parseInt(ptsRaw, 10);
    if(!name){ toast('请填写任务名称'); beep(false); return; }
    if(!pts || pts < 1 || isNaN(pts)){ toast('请填写有效的积分'); beep(false); return; }
    addCustomTask(type, name, desc, pts);
    wrap.querySelectorAll('input').forEach(i=>i.value='');
    wrap.style.display = 'none';
    return;
  }

  // 卡片勾选
  const card = e.target.closest('.task');
  if(!card) return;
  const t = MAP[card.dataset.id];
  if(t) toggleTask(t);
});

/* ==================== 搜索 ==================== */
const searchInput = document.getElementById('search');
const resultsBox = document.getElementById('results');

function norm(s){ return (s||'').replace(/\s+/g,'').toLowerCase(); }

function score(t, q){
  const n = norm(t.n), d = norm(t.d), Q = norm(q);
  if(!Q) return 0;
  if(n === Q) return 1000;
  if(n.includes(Q)) return 800 - n.length;
  if(Q.includes(n)) return 700;
  if(d.includes(Q)) return 500;
  let i = 0;
  for(const ch of n){ if(ch === Q[i]) i++; }
  if(i === Q.length) return 320;
  i = 0;
  for(const ch of d){ if(ch === Q[i]) i++; }
  if(i === Q.length) return 200;
  return 0;
}

function bestMatch(q){
  let best = null, bs = 0;
  for(const t of ALL){
    const s = score(t, q);
    if(s > bs){ bs = s; best = t; }
  }
  return bs > 0 ? best : null;
}

function showResults(q){
  if(!q){ hideResults(); return; }
  const ms = ALL.map(t=>({t, s:score(t,q)}))
                .filter(x=>x.s>0)
                .sort((a,b)=>b.s-a.s)
                .slice(0,6);
  if(!ms.length){
    resultsBox.innerHTML = '<div class="ritem"><span>未找到对应事项…</span></div>';
    resultsBox.classList.add('show');
    return;
  }
  resultsBox.innerHTML = ms.map(({t})=>{
    const done = isDone(t);
    const [,label] = rarity(t.p);
    return `<div class="ritem" data-id="${t.id}">
      <span>${esc(t.n)} <span style="opacity:.55;font-size:12px">[${label}]</span>${done?'　· 已完成':''}</span>
      <span class="rp">+${fmt(t.p)}</span>
    </div>`;
  }).join('');
  resultsBox.classList.add('show');
}

function hideResults(){ resultsBox.classList.remove('show'); }

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim();
  showResults(q);
  if(q){
    const exact = ALL.find(t=>norm(t.n) === norm(q));
    if(exact){
      completeTask(exact);
      searchInput.value = '';
      hideResults();
    }
  }
});

searchInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    const q = searchInput.value.trim();
    if(!q) return;
    const t = bestMatch(q);
    if(t){
      completeTask(t);
      searchInput.value = '';
      hideResults();
    }else{
      beep(false);
      toast('未找到对应的事项，试试别的关键词');
    }
  }
  if(e.key === 'Escape'){ searchInput.value=''; hideResults(); }
});

resultsBox.addEventListener('click', e=>{
  const item = e.target.closest('.ritem');
  if(!item || !item.dataset.id) return;
  const t = MAP[item.dataset.id];
  if(t){
    completeTask(t);
    searchInput.value = '';
    hideResults();
  }
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  searchInput.value = '';
  hideResults();
  searchInput.focus();
});

document.addEventListener('click', e=>{
  if(!e.target.closest('.searchbar')) hideResults();
});

/* ==================== 每日语录 ==================== */
function renderQuote(){
  const d = new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  const dayIdx = Math.floor((d - start) / 86400000);
  const q = QUOTES[dayIdx % QUOTES.length];
  const week = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('quote').innerHTML =
    `<span class="qmark">“</span>${q}<span class="qdate">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${week}</span>`;
  document.getElementById('today').textContent =
    `${d.getMonth()+1}月${d.getDate()}日 · 每日任务已刷新`;
}

/* ==================== 启动 ==================== */
document.querySelector('#nav button[data-tab="daily"]').classList.add('active');
renderQuote();
render();

/* 每分钟检查一次编辑部窗口状态，若跨天自动刷新按钮 */
setInterval(()=>{
  if(tab === 'hidden'){
    // 仅当状态可能变化时重绘
    render();
  }
}, 60000);
